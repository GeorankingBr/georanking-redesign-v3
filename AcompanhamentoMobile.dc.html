<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Perfis em acompanhamento · mobile</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Google Sans Text","Google Sans",Roboto,Arial,sans-serif;background:#F7F9FC;color:#1F1F1F;-webkit-font-smoothing:antialiased}
a{color:#1264C7;text-decoration:none}
.gs{font-family:"Google Sans",Roboto,Arial,sans-serif}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:22px;line-height:1;display:inline-block;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 14px;border-radius:12px;font-family:"Google Sans",Roboto,Arial,sans-serif;font-size:14px;font-weight:500;border:0;white-space:nowrap}
.btn-filled{background:#1264C7;color:#fff}.btn-outlined{background:#fff;color:#0B4FA8;border:1px solid #E2E6EA}.btn-text{background:transparent;color:#5F6368}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-family:"Google Sans",Roboto,Arial,sans-serif;font-size:12px;font-weight:500;white-space:nowrap}
.b-green{background:#EAF7EE;color:#137333}.b-yellow{background:#FFF7E0;color:#B06000}.b-red{background:#FCE8E6;color:#B3261E}.b-grey{background:#F3F6FA;color:#5F6368}
.hint{font-size:13px;line-height:18px;color:#5F6368}
.inp{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border:1px solid #E2E6EA;border-radius:12px;background:#fff;flex:1}
.inp input{border:0;outline:0;flex:1;font:15px "Google Sans Text",Roboto,Arial,sans-serif;color:#1F1F1F;background:transparent;min-width:0}
.af{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 6px 0 12px;border-radius:999px;background:#EAF1FB;color:#0B4FA8;font-size:13px;font-weight:500;white-space:nowrap}
.row{display:flex;flex-direction:column;gap:10px;padding:14px 16px;background:#fff;border-bottom:1px solid #EEF1F4}
.sw{width:36px;height:20px;border-radius:999px;background:#1264C7;position:relative;display:inline-block}
.sw::after{content:"";position:absolute;top:2px;left:18px;width:16px;height:16px;border-radius:999px;background:#fff}
.sw.off{background:#BDC1C6}.sw.off::after{left:2px}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -12px 36px rgba(31,35,41,.16);padding:8px 16px 24px;display:flex;flex-direction:column;gap:14px}
.opt{display:flex;align-items:center;gap:10px;height:44px;font-size:15px}
.opt input{width:20px;height:20px;accent-color:#1264C7;margin:0}
</style>
</helmet>
<div style="width: 390px; height: 1500px; box-sizing: border-box; display: flex; overflow: hidden; background: #E2E6EA">
  <div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F9FC; position: relative; overflow: hidden; display: flex; flex-direction: column">
    <header style="background: #fff; border-bottom: 1px solid #E2E6EA; padding: 8px 8px 8px 4px; display: flex; align-items: center; gap: 4px">
      <button aria-label="Menu" style="width: 44px; height: 44px; border: 0; background: transparent; color: #3C4043; display: inline-flex; align-items: center; justify-content: center"><span class="ms">menu</span></button>
      <span class="gs" style="font-size: 17px; font-weight: 500; flex: 1">Acompanhamento</span>
      <button aria-label="Sincronizar Radar" style="width: 44px; height: 44px; border: 0; background: transparent; color: #3C4043; display: inline-flex; align-items: center; justify-content: center"><span class="ms">radar</span></button>
      <button aria-label="Notificações" style="width: 44px; height: 44px; border: 0; background: transparent; color: #3C4043; display: inline-flex; align-items: center; justify-content: center"><span class="ms">notifications</span></button>
    </header>
    <div style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; gap: 8px">
        <label class="inp" for="q"><span class="ms" style="color: #5F6368">search</span><input id="q" placeholder="Buscar perfil ou cidade"></label>
        <button class="btn btn-outlined" style="height: 48px"><span class="ms" style="font-size: 20px">tune</span>Filtros (2)</button>
      </div>
      <div style="display: flex; gap: 8px; overflow: hidden">
        <span class="af">Status: Crítico<span class="ms" style="font-size: 16px">close</span></span>
        <span class="af">Estado: BA<span class="ms" style="font-size: 16px">close</span></span>
        <button class="btn btn-text" style="height: 32px; padding: 0 8px; font-size: 13px">Limpar</button>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 0"><span class="hint">14 perfis · ordenado por gravidade</span><button class="btn btn-text" style="height: 32px; padding: 0 6px; font-size: 13px"><span class="ms" style="font-size: 18px">swap_vert</span>Ordenar</button></div>
    </div>
    <div style="flex: 1; overflow: hidden; margin-top: 6px; border-top: 1px solid #E2E6EA">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
        <div class="row">
          <div style="display: flex; align-items: flex-start; gap: 12px">
            <span class="gs" style="width: 40px; height: 40px; border-radius: 10px; background: {{r.avBg}}; color: {{r.avFg}}; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; flex-shrink: 0">{{r.ini}}</span>
            <div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
              <span class="gs" style="font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.nome}}</span>
              <span class="hint">{{r.local}} · {{r.kw}} palavras · sync {{r.sync}}</span>
            </div>
            <span class="badge {{r.stCls}}">{{r.st}}</span>
          </div>
          <div style="display: flex; align-items: center; gap: 8px">
            <span class="sw {{r.sw}}" aria-label="Acompanhar"></span><span class="hint">Acompanhar</span>
            <span style="flex: 1"></span>
            <a href="PerfilMobile.dc.html" class="btn btn-outlined" style="height: 40px">Gerenciar</a>
            <button aria-label="Mais" style="width: 40px; height: 40px; border: 0; background: transparent; color: #5F6368; display: inline-flex; align-items: center; justify-content: center"><span class="ms">more_vert</span></button>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F9FC; position: relative; overflow: hidden">
    <div style="position: absolute; inset: 0; background: rgba(31,35,41,.45)"></div>
    <div class="sheet">
      <div style="width: 36px; height: 4px; border-radius: 2px; background: #D4D9DE; margin: 4px auto 0"></div>
      <div style="display: flex; align-items: center; justify-content: space-between"><span class="gs" style="font-size: 17px; font-weight: 600">Filtros</span><button class="btn btn-text" style="height: 36px">Limpar tudo</button></div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span class="hint" style="font-family: 'Google Sans', Roboto, Arial, sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; font-size: 11px; padding-bottom: 4px">Status</span>
        <label class="opt"><input type="checkbox">Ok</label>
        <label class="opt"><input type="checkbox">Atenção</label>
        <label class="opt"><input type="checkbox" checked>Crítico</label>
        <label class="opt"><input type="checkbox">Duplicata no Google</label>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span class="hint" style="font-family: 'Google Sans', Roboto, Arial, sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; font-size: 11px; padding-bottom: 4px">Palavras ranqueadas</span>
        <label class="opt"><input type="radio" name="kw" checked>Todas</label>
        <label class="opt"><input type="radio" name="kw">Zero</label>
        <label class="opt"><input type="radio" name="kw">1 a 7</label>
        <label class="opt"><input type="radio" name="kw">8 ou mais</label>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span class="hint" style="font-family: 'Google Sans', Roboto, Arial, sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; font-size: 11px">Localidade</span>
        <label class="inp" for="uf" style="height: 48px"><span class="ms" style="color: #5F6368">place</span><input id="uf" value="BA"></label>
      </div>
      <button class="btn btn-filled" style="height: 52px; margin-top: 4px">Mostrar 14 perfis</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    const mk = (ini, nome, local, st, kw, sync, on) => ({ ini, nome, local, st, stCls: st === 'Ok' ? 'b-green' : st === 'Atenção' ? 'b-yellow' : st === 'Crítico' ? 'b-red' : 'b-grey', kw, sync, sw: on ? '' : 'off', avBg: st === 'Crítico' ? '#FCE8E6' : st === 'Atenção' ? '#FFF7E0' : '#EAF7EE', avFg: st === 'Crítico' ? '#B3261E' : st === 'Atenção' ? '#B06000' : '#137333' });
    const rows = [
      mk('IH', 'Imobiliária Horizonte', 'Palmas · TO', 'Crítico', 0, 'falhou', true),
      mk('AR', 'Auto Peças Rodovia', 'Anápolis · GO', 'Crítico', 0, 'há 6 dias', false),
      mk('FC', 'Farmácia Central', 'Uberlândia · MG', 'Atenção', 3, 'pendente', true),
      mk('OV', 'Oficina Vale Verde', 'Cuiabá · MT', 'Atenção', 5, 'em andamento', true),
      mk('EB', 'Estilo Bordados', 'Goiânia · GO', 'Ok', 11, 'hoje', true)
    ];
    return { rows };
  }
}
</script>
</body>
</html>

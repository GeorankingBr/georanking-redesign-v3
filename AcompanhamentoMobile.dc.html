<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Acompanhamento · mobile e FilterSheet</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Google Sans Text","Google Sans",Roboto,Arial,sans-serif;background:#F7F9FC;color:#1F1F1F;-webkit-font-smoothing:antialiased}
a{color:#1264C7;text-decoration:none}
.gs{font-family:"Google Sans",Roboto,Arial,sans-serif}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:22px;line-height:1;display:inline-block;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:12px;font-family:"Google Sans",Roboto,Arial,sans-serif;font-size:14px;font-weight:500;border:0;white-space:nowrap}
.btn-filled{background:#1264C7;color:#fff}.btn-outlined{background:#fff;color:#0B4FA8;border:1px solid #D4D9DE}.btn-text{background:transparent;color:#5F6368}
.badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-family:"Google Sans",Roboto,Arial,sans-serif;font-size:12px;font-weight:500;white-space:nowrap}
.b-green{background:#EAF7EE;color:#137333}.b-yellow{background:#FFF7E0;color:#B06000}.b-red{background:#FCE8E6;color:#B3261E}.b-grey{background:#F3F6FA;color:#5F6368}
.meta{font-size:13px;line-height:18px;color:#5F6368}
.ib{width:44px;height:44px;border:0;background:transparent;color:#3C4043;display:inline-flex;align-items:center;justify-content:center;border-radius:10px}
.inp{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border:1px solid #D4D9DE;border-radius:12px;background:#fff}
.inp input{border:0;outline:0;flex:1;font:16px "Google Sans Text",Roboto,Arial,sans-serif;color:#1F1F1F;background:transparent;min-width:0}
.af{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 8px 0 12px;border-radius:999px;background:#EAF1FB;color:#0B4FA8;font-size:13px;font-weight:500;white-space:nowrap}
.row{display:flex;flex-direction:column;gap:10px;padding:16px;background:#fff;border-bottom:1px solid #E2E6EA;min-height:104px;box-sizing:border-box}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:85%;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -12px 36px rgba(31,35,41,.18);display:flex;flex-direction:column}
.opt{display:flex;align-items:center;gap:12px;min-height:44px;font-size:15px}
.opt input{width:20px;height:20px;accent-color:#1264C7;margin:0}
.grp{font-family:"Google Sans",Roboto,Arial,sans-serif;font-size:11px;font-weight:600;letter-spacing:.6px;color:#80868B;text-transform:uppercase;padding: 8px 0 2px}
</style>
</helmet>
<div style="width: 830px; height: 900px; box-sizing: border-box; display: flex; gap: 50px; overflow: hidden; background: #E2E6EA; padding: 28px">

  <div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F9FC; position: relative; overflow: hidden; display: flex; flex-direction: column; border-radius: 24px">
    <header style="background: #fff; border-bottom: 1px solid #E2E6EA; padding: 8px 8px 8px 4px; display: flex; align-items: center; gap: 4px">
      <button class="ib" aria-label="Menu"><span class="ms">menu</span></button>
      <span class="gs" style="font-size: 17px; font-weight: 500; flex: 1">Acompanhamento</span>
      <button class="ib" aria-label="Sincronizar Radar"><span class="ms">radar</span></button>
    </header>
    <div style="padding: 12px 16px 8px; display: flex; flex-direction: column; gap: 10px; background: #fff; border-bottom: 1px solid #E2E6EA">
      <label class="inp" for="q"><span class="ms" style="color: #5F6368">search</span><input id="q" placeholder="Buscar perfis"></label>
      <div style="display: flex; gap: 8px">
        <button class="btn btn-outlined" style="flex: 1"><span class="ms" style="font-size: 20px">tune</span>Filtros (2)</button>
        <button class="btn btn-outlined" style="flex: 1"><span class="ms" style="font-size: 20px">swap_vert</span>Ordenar</button>
      </div>
      <div style="display: flex; gap: 8px; overflow: hidden; align-items: center">
        <span class="af">Status: Crítico<span class="ms" style="font-size: 18px">close</span></span>
        <span class="af">BA<span class="ms" style="font-size: 18px">close</span></span>
        <span class="meta" style="margin-left: auto">14 perfis</span>
      </div>
    </div>
    <div style="flex: 1; overflow: hidden">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
        <div class="row">
          <div style="display: flex; align-items: flex-start; gap: 12px">
            <span class="gs" style="width: 40px; height: 40px; border-radius: 10px; background: {{r.avBg}}; color: {{r.avFg}}; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; flex-shrink: 0">{{r.ini}}</span>
            <div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
              <span class="gs" style="font-size: 16px; line-height: 21px; font-weight: 500">{{r.nome}}</span>
              <span class="meta">{{r.local}}</span>
            </div>
            <span class="badge {{r.stCls}}">{{r.st}}</span>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-left: 52px">
            <span class="meta"><b style="color: #1F1F1F; font-weight: 500">{{r.kw}}</b> · {{r.sync}}</span>
          </div>
          <div style="display: flex; align-items: center; gap: 8px; padding-left: 52px">
            <a href="PerfilMobile.dc.html" class="btn btn-outlined" style="height: 40px">Gerenciar</a>
            <span style="flex: 1"></span>
            <button class="ib" aria-label="Mais ações" style="width: 40px; height: 40px"><span class="ms">more_vert</span></button>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F9FC; position: relative; overflow: hidden; border-radius: 24px">
    <div style="position: absolute; inset: 0; background: rgba(31,35,41,.45)"></div>
    <div class="sheet" style="height: 700px">
      <div style="padding: 10px 16px 12px; border-bottom: 1px solid #EEF1F4; display: flex; flex-direction: column; gap: 10px">
        <div style="width: 36px; height: 4px; border-radius: 2px; background: #D4D9DE; margin: 0 auto"></div>
        <div style="display: flex; align-items: center; justify-content: space-between"><span class="gs" style="font-size: 18px; font-weight: 600">Filtros</span><button class="ib" aria-label="Fechar"><span class="ms">close</span></button></div>
      </div>
      <div style="flex: 1; overflow: hidden; padding: 8px 16px; display: flex; flex-direction: column; gap: 6px">
        <span class="grp">Status</span>
        <label class="opt"><input type="checkbox">Saudáveis (8+ palavras)</label>
        <label class="opt"><input type="checkbox">Atenção (1–7 palavras)</label>
        <label class="opt"><input type="checkbox" checked>Críticos (sem ranking)</label>
        <label class="opt"><input type="checkbox">Duplicata no Google</label>
        <span class="grp">Sincronização</span>
        <label class="opt"><input type="radio" name="s" checked>Todas</label>
        <label class="opt"><input type="radio" name="s">Falhou</label>
        <label class="opt"><input type="radio" name="s">Pendente</label>
        <span class="grp">Localidade</span>
        <label class="inp" for="uf"><span class="ms" style="color: #5F6368">place</span><input id="uf" value="BA"></label>
      </div>
      <div style="padding: 12px 16px 28px; border-top: 1px solid #EEF1F4; display: flex; gap: 10px; background: #fff">
        <button class="btn btn-text" style="height: 48px">Limpar</button>
        <button class="btn btn-filled" style="height: 48px; flex: 1">Mostrar 14 resultados</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":830,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const mk = (ini, nome, local, st, kw, sync) => ({ ini, nome, local, st, stCls: st === 'Saudável' ? 'b-green' : st === 'Atenção' ? 'b-yellow' : st === 'Crítico' ? 'b-red' : 'b-grey', kw, sync, avBg: st === 'Crítico' ? '#FCE8E6' : st === 'Atenção' ? '#FFF7E0' : '#EAF7EE', avFg: st === 'Crítico' ? '#B3261E' : st === 'Atenção' ? '#B06000' : '#137333' });
    const rows = [
      mk('IH', 'Imobiliária Horizonte', 'Palmas · TO', 'Crítico', '0 palavras', 'Sync falhou · há 4 d'),
      mk('AR', 'Auto Peças Rodovia', 'Anápolis · GO', 'Crítico', '0 palavras', 'Sync pendente · há 6 d'),
      mk('FC', 'Farmácia Central', 'Uberlândia · MG', 'Atenção', '3 palavras', 'Sync pendente · há 2 d'),
      mk('OV', 'Oficina Vale Verde', 'Cuiabá · MT', 'Atenção', '5 palavras', 'Sincronizando')
    ];
    return { rows };
  }
}
</script>
</body>
</html>

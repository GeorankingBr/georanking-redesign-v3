<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cabeçalho de contexto do perfil</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Google Sans Text","Google Sans",Roboto,Arial,sans-serif;color:#1F1F1F;-webkit-font-smoothing:antialiased}
a{color:#1264C7;text-decoration:none}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:20px;line-height:1;display:inline-block;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.iconbtn{width:40px;height:40px;border-radius:10px;border:0;background:transparent;color:#3C4043;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn:hover{background:#F3F6FA}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:10px;font-family:"Google Sans",Roboto,Arial,sans-serif;font-size:14px;font-weight:500;border:1px solid #E2E6EA;background:#fff;color:#0B4FA8;white-space:nowrap}
.btn:hover{background:#F3F6FA}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-family:"Google Sans",Roboto,Arial,sans-serif;font-size:12px;font-weight:500;white-space:nowrap}
</style>
</helmet>
<div style="width: 1440px; height: 72px; box-sizing: border-box; background: #ffffff; border-bottom: 1px solid #E2E6EA; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; gap: 24px">
  <div style="display: flex; align-items: center; gap: 14px; min-width: 0">
    <button class="iconbtn" aria-label="Voltar para a lista"><span class="ms">arrow_back</span></button>
    <span class="ms" style="width: 40px; height: 40px; border-radius: 10px; background: #EAF1FB; color: #0B4FA8; display: inline-flex; align-items: center; justify-content: center; font-size: 22px">storefront</span>
    <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
      <span style="font-family: 'Google Sans', Roboto, Arial, sans-serif; font-size: 17px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{nome}}</span>
      <span style="font-size: 13px; color: #5F6368">Barreiras, BA · Loja de artigos para caça e pesca</span>
    </div>
    <span class="badge" style="background: #EAF7EE; color: #137333; margin-left: 8px"><span style="width: 6px; height: 6px; border-radius: 999px; background: #1E8E3E"></span>Aberto e operacional</span>
    <span class="badge" style="background: #F3F6FA; color: #5F6368"><span class="ms" style="font-size: 14px">sync</span>Fonte: Google Business Profile · sync hoje, 14:20</span>
  </div>
  <div style="display: flex; align-items: center; gap: 6px">
    <span style="font-size: 13px; color: #5F6368; margin-right: 8px">Perfil 82% completo</span>
    <a href="#google" class="btn"><span class="ms" style="font-size: 18px">open_in_new</span>Ver no Google</a>
    <button class="iconbtn" aria-label="Histórico de alterações"><span class="ms">history</span></button>
    <button class="iconbtn" aria-label="Fechar editor"><span class="ms">close</span></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"nome":{"editor":"text","default":"Náutica Caça e Pesca"},"$preview":{"width":1440,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    return { nome: this.props.nome ?? 'Náutica Caça e Pesca' };
  }
}
</script>
</body>
</html>

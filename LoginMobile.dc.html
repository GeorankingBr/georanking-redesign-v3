.route{stroke-dasharray:500;stroke-dashoffset:500;animation:draw 1.4s cubic-bezier(.2,0,0,1) .3s forwards}

.cov{transform-box:fill-box;transform-origin:center;animation:cov 3s ease-out 1s infinite}

.pin{transform-box:fill-box;transform-origin:center bottom;animation:drop .7s cubic-bezier(.2,.8,.2,1) 1.1s both}
